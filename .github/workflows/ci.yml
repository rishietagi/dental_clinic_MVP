# Continuous integration — runs the test/build checks on every push and PR to main.
# TESTS ONLY. No deploy: deployment is Phase 7 (see docs/BUILD_PLAN.md). Do not add
# deploy steps here before then.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres for the DB-backed tests (staff_user, step 1.2). Same creds/db name
    # as the local compose db so DATABASE_URL is the only thing that differs.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # The service is reachable on localhost:5432 from the job runner.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/clinic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Plain pip on a clean machine — conda is a local convenience only. The
      # requirements are pinned, so versions match what we run locally.
      - run: pip install -r requirements.txt

      # Prove the migrations apply cleanly on a fresh database.
      - run: alembic upgrade head

      # With DATABASE_URL set + the migration applied, the DB-backed tests run
      # for real (they self-skip only when no database is reachable).
      - run: python -m pytest -q

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly from package-lock.json — reproducible, unlike npm install.
      - run: npm ci

      - run: npm run lint

      # Catches type errors and the standalone build breaking.
      - run: npm run build
