# Continuous integration — runs the test/build checks on every push and PR to main.
# TESTS ONLY. No deploy: deployment is Phase 7 (see docs/BUILD_PLAN.md). Do not add
# deploy steps here before then.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Plain pip on a clean machine — conda is a local convenience only. The
      # requirements are pinned, so versions match what we run locally.
      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  # No Postgres service here yet: the only test hits /health and never touches
  # the database. Add a postgres service + `alembic upgrade head` in Phase 2,
  # when the first model and DB-backed tests exist and it actually proves something.

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly from package-lock.json — reproducible, unlike npm install.
      - run: npm ci

      - run: npm run lint

      # Catches type errors and the standalone build breaking.
      - run: npm run build
