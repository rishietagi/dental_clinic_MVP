# Local development stack. Prod (Phase 7) will be a separate compose file.
# `docker compose up --build` → app at http://localhost
#
# All config is here via env; nothing is hardcoded in the images.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app talks to it, over the compose network.

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/clinic
      ENVIRONMENT: development
      # Same-origin through Caddy, plus the direct dev port just in case.
      CORS_ORIGINS: http://localhost,http://localhost:3000
      # The single local staff row every write is attributed to (10.1 — there is
      # no login). Defaults in app/config.py are fine for dev; override only if
      # you need a different identity. `python -m app.seed` creates the row.
      LOCAL_STAFF_ID: ${LOCAL_STAFF_ID:-}
      LOCAL_STAFF_EMAIL: ${LOCAL_STAFF_EMAIL:-}
      LOCAL_STAFF_NAME: ${LOCAL_STAFF_NAME:-}
      # Where uploaded patient files are stored (5.6). A named volume in dev;
      # Phase 7 swaps the storage backend (cloud) by config, not architecture.
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    # --reload for local dev; the image's default CMD omits it.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Bind-mount source so edits hot-reload. Not baked into the prod image.
      - ./backend/app:/app/app
      # Uploaded files persist here, separate from the DB. Local dev only.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time. The browser reaches the
        # backend THROUGH Caddy at /api — never a Docker hostname it can't resolve.
        NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads:
